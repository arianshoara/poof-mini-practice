<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/navigation.js" defer></script>
  <title>POOF Mini Practice | Account</title>
</head>

<body>
  <header>
    <h1>POOF Mini Practice</h1>
    <p>A small practice project for understanding how POOF works.</p>
  </header>

  <nav id="main-navigation"></nav>

  <main>
    <h2>Account</h2>
    <p>Your profile and settings will appear here.</p>
    
    <section class="theme-settings" aria-labelledby="theme-heading">
    <h3 id="theme-heading">Theme</h3>

    <p id="theme-status" aria-live="polite">
        Current theme: Snowy
    </p>

     <div class="theme-options">
        <button
            class="theme-option"
            type="button"
            data-theme-value="classic"
            aria-pressed="false"
        >
            <span class="theme-option-title">Classic</span>
            <span class="theme-option-description">
                Warm and dark
            </span>
        </button>

        <button
            class="theme-option"
            type="button"
            data-theme-value="snowy"
            aria-pressed="false"
        >
            <span class="theme-option-title">Snowy</span>
            <span class="theme-option-description">
                Cold and peaceful
            </span>
        </button>
     </div>
    </section>
    
  </main>
</body>
</html>
