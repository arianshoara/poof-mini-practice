<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/navigation.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/cards.js" defer></script>
  <title>POOF Mini Practice | Cards</title>
</head>

<body>
  <header>
    <h1>POOF Mini Practice</h1>
    <p>A small practice project for understanding how POOF works.</p>
  </header>

  <nav id="main-navigation"></nav>

  <main>
    <h2>Cards</h2>
    <p>Your saved vocabulary cards will appear here.</p>

              <section
            class="card-builder"
            aria-labelledby="card-builder-title"
        >
            <h3 id="card-builder-title">
                Create a card
            </h3>
        
            <form id="card-builder-form">
                <div class="card-builder__field card-builder__field--wide">
                    <label for="card-word">
                        Word
                    </label>
        
                    <input
                        id="card-word"
                        name="word"
                        type="text"
                        lang="de"
                        maxlength="120"
                        autocomplete="off"
                        required
                    >
                </div>
        
                <div class="card-builder__field">
                    <label for="card-meaning">
                        Meaning
                    </label>
        
                    <input
                        id="card-meaning"
                        name="meaning"
                        type="text"
                        dir="auto"
                        maxlength="200"
                        autocomplete="off"
                        required
                    >
                </div>
        
                <div class="card-builder__field">
                    <label for="card-example">
                        Example
                    </label>
        
                    <textarea
                        id="card-example"
                        name="example"
                        lang="de"
                        dir="auto"
                        rows="3"
                        maxlength="400"
                    ></textarea>
                </div>
        
                <div class="card-builder__field">
                    <label for="card-deck">
                        Deck
                    </label>
        
                    <select
                        id="card-deck"
                        name="deck_id"
                    >
                        <option value="default">
                            Default deck
                        </option>
                    </select>
                </div>
        
                <button
                    class="card-builder__submit"
                    type="submit"
                >
                    Save card
                </button>
        
                <p
                    id="card-builder-message"
                    class="card-builder__message"
                    aria-live="polite"
                ></p>
            </form>
        </section>
      
      <section
      class="cards-summary"
      aria-labelledby="cards-summary-title"
      >
        <h3 id="cards-summary-title">
            Saved cards
        </h3>
  
        <p id="card-count" aria-live="polite">
            Loading saved cards...
        </p>
        
      </section>
    
  </main>
</body>
</html>
